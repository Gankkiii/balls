<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R06 竞技场B · 纯UI示意</title><style>html,body{margin:0;background:#dfe2d4;font-family:"Noto Sans CJK SC",sans-serif}#stage{width:1600px;height:900px;position:relative;transform-origin:top left;overflow:hidden}#scene{position:absolute;inset:0;width:1600px;height:900px}button,input{position:absolute;box-sizing:border-box;font:600 22px "Noto Sans CJK SC",sans-serif}button{border:0;background:transparent;cursor:pointer;color:#243746}button:hover{outline:4px solid #398a79;outline-offset:-4px;background:#67afc922}button:focus-visible{outline:5px solid #e4b86d;outline-offset:-5px}button.on{box-shadow:inset 0 0 0 5px #398a79;background:#A6CFC1!important}button:disabled{cursor:default}.common{border:3px solid #243746}#toast{position:absolute;left:480px;top:100px;max-width:650px;padding:12px 22px;background:#fff8e8;border:3px solid #243746;font-size:20px;display:none;z-index:12}#disclaimer{position:absolute;left:22px;top:104px;font-size:13px;color:#6d7c78;pointer-events:none}.cover{position:absolute;background:#f3efdfbb;pointer-events:none}#close{z-index:10}#shade{position:absolute;inset:100px 0 96px;background:#213c4566;z-index:15;display:none}#helpbox{position:absolute;left:410px;top:240px;width:780px;padding:30px;background:#fff8e8;border:4px solid #283e45;line-height:1.8}#helpbox button{position:static;background:#398a79;color:#fff8e8;padding:12px 24px}#helpbox h2{margin:0}#helpbox p{font-size:23px}#search{background:#e4e7dc;border:0;color:#283e45;padding:8px 16px;outline:0}</style><main id="stage"><img id="scene" src="main.png" alt="竞技场B方向细化效果图"><div id="toast" role="status"></div><div id="disclaimer">纯UI示意 · 非游戏运行</div><div id="shade"><section id="helpbox"><h2>页面说明</h2><p id="helptext"></p><button onclick="document.getElementById('shade').style.display='none'">关闭</button></section></div></main><script>
const stage=document.getElementById('stage'),scene=document.getElementById('scene');function scale(){let s=Math.min(innerWidth/1600,innerHeight/900);stage.style.transform=`scale(${s})`;document.body.style.height=(900*s)+'px'}addEventListener('resize',scale);scale();function toast(t){let a=document.getElementById('toast');a.textContent=t;a.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>a.style.display='none',2600)}function button(id,label,x,y,w,h,fn){let b=document.createElement('button');b.id=id;b.title=label;b.setAttribute('aria-label',label);Object.assign(b.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});b.onclick=fn;stage.appendChild(b);return b}function nav(page){parent.postMessage({type:'r06-nav',page},'*');toast('切换页面：'+{arena:'竞技场',story:'主线',storage:'仓库',hatch:'孵蛋'}[page]+'（评审导航）')}function help(t){document.getElementById('helptext').textContent=t;document.getElementById('shade').style.display='block'}

u606f",998,811,54,54,()=>{showInfo(true)}).className="common";document.querySelectorAll(".rate").forEach((b,i)=>{b.textContent=(i+1)+"×";b.style.background="#F6EDD9"});document.getElementById("1×").classList.add("on");button("left-info","鱼信息",259,699,40,40,()=>showInfo(true));button("right-info","羊信息",1295,699,40,40,()=>showInfo(true));button("close","关闭信息",995,278,54,54,()=>showInfo(false)).style.display="none";
</script></html>
