name: Build Balls demo Android APK

# Game changes are built manually. Updating this workflow also validates the build.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android-demo.yml']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android export tools
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "build-tools;35.0.1" "platforms;android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.1/apksigner"
          java -version

      - name: Install verified Godot 4.6.3 and Android templates
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot/releases/download/4.6.3-stable
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 "$base/Godot_v4.6.3-stable_linux.x86_64.zip" -o godot.zip
          echo 'd0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3  godot.zip' | sha256sum --check
          unzip -q godot.zip -d godot
          chmod +x godot/Godot_v4.6.3-stable_linux.x86_64
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 "$base/Godot_v4.6.3-stable_export_templates.tpz" -o templates.tpz
          echo '3fbe2c0e2dec9d537ab9ec97bcf8da91dcf23357fc51f67092dd068d839290a8  templates.tpz' | sha256sum --check
          template_dir="$HOME/.local/share/godot/export_templates/4.6.3.stable"
          mkdir -p "$template_dir"
          unzip -j -q templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' -d "$template_dir"

      - name: Import, run every regression suite, and smoke test
        run: python3 scripts/run_regression.py

      - name: Export debug-signed APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing" build
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/signing/debug.keystore"
          keytool -genkeypair -noprompt -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          "$GODOT_BIN" --headless --path demo --export-debug Android "$GITHUB_WORKSPACE/build/balls-demo.apk" 2>&1 | tee build/export.log
          test -s build/balls-demo.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs build/balls-demo.apk | tee build/signature.txt
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging build/balls-demo.apk | tee build/apk-info.txt
          grep -q "package: name='org.gankkiii.ballsdemo'" build/apk-info.txt
          grep -q "native-code:.*'arm64-v8a'" build/apk-info.txt
          grep -q "native-code:.*'armeabi-v7a'" build/apk-info.txt
          (cd build && sha256sum balls-demo.apk > SHA256SUMS.txt)
          printf 'Commit: %s\nGodot: 4.6.3\nBuild: %s/%s/actions/runs/%s\nSigning: ephemeral debug key\nDevice testing: NOT RUN\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > build/BUILD_INFO.txt

      - name: Upload APK and verification results
        uses: actions/upload-artifact@v4
        with:
          name: balls-demo-android-apk
          path: |
            build/balls-demo.apk
            build/SHA256SUMS.txt
            build/BUILD_INFO.txt
            build/apk-info.txt
            build/signature.txt
            build/export.log
            build/test-logs/
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: balls-demo-failure-logs
          path: |
            build/test-logs/
            build/export.log
          if-no-files-found: ignore
          retention-days: 7
