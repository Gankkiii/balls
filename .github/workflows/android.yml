name: Test and build Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.3 and Android templates
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fL "$base/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
          curl -fL "$base/Godot_v4.6.3-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          unzip -j /tmp/templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' -d "$HOME/.local/share/godot/export_templates/4.6.3.stable"
      - name: Import and regression tests
        run: |
          Godot_v4.6.3-stable_linux.x86_64 --headless --editor --import --quit
          set -o pipefail
          Godot_v4.6.3-stable_linux.x86_64 --headless --script tests/run_tests.gd | tee test-results.txt
          grep -q 'failed=0.*manual_not_run=2.*failures=0' test-results.txt
          Godot_v4.6.3-stable_linux.x86_64 --headless --script tests/test_characters.gd | tee character-test-results.txt
          grep -q 'ROLE RESULT.*failures=0' character-test-results.txt
          Godot_v4.6.3-stable_linux.x86_64 --headless --script tests/independent_gameplay_cases.gd | tee independent-gameplay-results.txt
          grep -q 'INDEPENDENT RESULT cases=25 passed=25 failed=0.*failures=0' independent-gameplay-results.txt
      - name: Configure debug signing and Android export
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot" "$RUNNER_TEMP/signing" build
          keytool -genkeypair -keystore "$RUNNER_TEMP/signing/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/signing/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          Godot_v4.6.3-stable_linux.x86_64 --headless --export-debug Android build/smooth-arena.apk
          test -s build/smooth-arena.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose build/smooth-arena.apk
          sha256sum build/smooth-arena.apk > build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: smooth-arena-android-apk
          path: |
            build/smooth-arena.apk
            build/SHA256SUMS.txt
            test-results.txt
            character-test-results.txt
            independent-gameplay-results.txt
          retention-days: 14
