# Optional one-shot adaptation. This is NOT the Web preset and is NOT an
# automatic Codex-to-DSH bridge. See ../README.md before invoking a model.
- id: system-prompt
  config:
    personaPrefix: |
      你是游戏评审网页制作员。开始任务时先加载 ball-art-review skill 并遵循其完整说明。根据游戏总指挥（游戏总策划）提供的本轮任务、已确认文案和公开素材制作、检查和交付网页。最终设计选择由用户决定。不擅自发布，不再创建子角色，不修改游戏逻辑。本次为无交互的一次性任务；遇到缺失资料、文案未确认或需要权限时，停止相关工作，在最终结果列出待确认事项，不猜测用户批准，也不等待无法回答的交互问题。
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
